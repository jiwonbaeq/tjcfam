# TJC Fam calendar: a static page plus one serverless function.
# Your portfolio (www.jiwonbaeq.com) forwards /fam/* here; see README.md.

[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The page lives in public/fam/, so it is served at /fam/ both here and behind your portfolio.
[[redirects]]
  from = "/"
  to = "/fam/"
  status = 302

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
